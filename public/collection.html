<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1422">
  <title>Mon classeur · Jeanpip</title>
  <!-- Chemins relatifs : la page est servie sur …/collection/<user> (derrière un préfixe de proxy) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="../collection.css?v=__ASSET_VERSION__">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">JEANPIP <span>ALBUM OFFICIEL</span></div>
    <div class="progress" id="progress" hidden>
      <div class="progress-text"><b id="progress-owned">0</b> / <span id="progress-total">0</span></div>
      <div class="progress-bar"><i id="progress-fill"></i></div>
    </div>
    <div class="controls">
      <span class="live" id="live" data-state="connecting" title="Mise à jour automatique">
        <i></i><span id="live-text">CONNEXION…</span>
      </span>
      <a class="pill-btn" href="slack://open">Slack</a>
    </div>
  </header>

  <main id="stage">
    <!-- ⏳ Chargement -->
    <section class="screen is-active" id="screen-loading">
      <div class="loader"></div>
      <p class="hint">Ouverture du classeur…</p>
    </section>

    <!-- 📒 Le classeur -->
    <section class="screen" id="screen-album">
      <nav class="tabs" id="tabs" aria-label="Intercalaires"></nav>
      <div class="binder-wrap">
        <button type="button" class="turn-btn prev" id="btn-prev" aria-label="Page précédente">‹</button>
        <div class="binder" id="binder">
          <div class="spread" id="spread"></div>
          <div class="rings" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>
        <button type="button" class="turn-btn next" id="btn-next" aria-label="Page suivante">›</button>
      </div>
      <p class="pager" id="pager" aria-live="polite"></p>
    </section>

    <!-- ⚠️ Erreurs -->
    <section class="screen" id="screen-error">
      <div class="error-box">
        <div class="error-emoji" id="error-emoji">😕</div>
        <h1 id="error-title">Oups</h1>
        <p id="error-text"></p>
        <a class="pill-btn primary" href="slack://open">Retour à Slack</a>
      </div>
    </section>
  </main>

  <!-- 🔍 Carte en grand -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-card" role="dialog" aria-modal="true" aria-labelledby="lb-title">
      <button type="button" class="icon-btn lb-close" id="lb-close" aria-label="Fermer">✕</button>
      <div class="lb-sticker" id="lb-sticker"></div>
      <div class="lb-info">
        <p class="lb-num" id="lb-num"></p>
        <h2 id="lb-title"></h2>
        <p class="lb-meta" id="lb-meta"></p>
        <a class="pill-btn primary" id="lb-link" target="_blank" rel="noopener">Voir le média ↗</a>
      </div>
    </div>
  </div>

  <!-- 🔔 Arrivées en direct -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="../collection.js?v=__ASSET_VERSION__"></script>
</body>
</html>
